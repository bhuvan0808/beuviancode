# golangci-lint configuration for every Beuvian Go module.
#
# One shared config at the root rather than per-module files, so the three modules
# cannot drift into different standards. CI passes it explicitly with --config
# because each module is linted from its own directory.

version: "2"

run:
  timeout: 5m
  # Lint the per-OS files too. Without this, power_windows.go and power_darwin.go
  # are invisible to the linter on a Linux runner — exactly the files most likely
  # to rot unnoticed.
  build-tags: []

linters:
  default: standard
  enable:
    # --- Correctness ---
    - errorlint      # requires %w and errors.Is/As instead of == comparisons
    - bodyclose      # an unclosed HTTP body leaks a connection per request
    - rowserrcheck   # a missed rows.Err() silently truncates query results
    - sqlclosecheck
    - nilerr         # returning nil after checking err != nil
    - noctx          # HTTP requests without a context cannot be cancelled
    - contextcheck
    - durationcheck  # catches time.Duration multiplication mistakes

    # --- Security ---
    - gosec

    # --- Clarity and maintainability ---
    - revive
    - misspell
    - unconvert
    - wastedassign
    - godot          # comments end with a period, so godoc renders cleanly
    - predeclared    # shadowing `len`, `cap`, `new` is always a mistake
    - copyloopvar

    # --- Concurrency ---
    # The gateway, registry, and supervisor are all concurrent; these catch the
    # mistakes the race detector only finds if a test happens to exercise them.
    - makezero

settings:
  gosec:
    excludes:
      # G104 duplicates errcheck, which is already in the standard set.
      - G104
    config:
      # File permissions: 0600 for state and log files, 0700 for directories.
      G302: "0600"
      G306: "0600"

  govet:
    enable-all: true
    disable:
      # fieldalignment optimises struct memory layout at the cost of grouping
      # related fields together. Readability wins for config structs, which is
      # most of what we have.
      - fieldalignment

  revive:
    rules:
      - name: exported
        # Every exported symbol needs a doc comment. This is a library consumed
        # across module boundaries, so undocumented exports are a real cost.
        arguments: [checkPrivateReceivers, disableStutteringCheck]
      - name: error-strings
      - name: error-return
      - name: context-as-argument
      - name: context-keys-type
      - name: indent-error-flow
      - name: unexported-return
      - name: var-naming
      - name: package-comments

  errcheck:
    # Deferred Close on a read-only handle has no meaningful failure to handle,
    # and forcing `_ =` on every one adds noise without adding safety.
    exclude-functions:
      - (io.Closer).Close
      - (*os.File).Close

  misspell:
    # PROJECT.md and these sources use British spellings in prose.
    locale: UK

exclusions:
  generated: lax
  rules:
    # Tests get a looser standard deliberately: table-driven tests are repetitive
    # by nature, and test fixtures do not need exported-symbol documentation.
    - path: _test\.go
      linters:
        - gosec
        - errcheck
        - revive
        - godot

    # Long struct tags in configuration schemas cannot be wrapped without
    # breaking them.
    - path: internal/config/config\.go
      linters:
        - lll

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/bhuvan0808/beuviancode

issues:
  # Report everything. Defaults cap at 3 issues per linter, which hides the
  # majority of a first run and makes the tool feel like it found little.
  max-issues-per-linter: 0
  max-same-issues: 0
